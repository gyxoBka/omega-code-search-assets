schema_version = 1
distribution_class = "production"
kind = "language"
name = "omega-zig"
version = "2.0.0"
pack_runtime_version = "2"
parser_id = "tree-sitter-zig"
compatible_grammar_identities = ["tree-sitter-zig@6479aa13f32f701c383083d8b28360ebd682fb7d#nodes:a3a7f88f3a0e88cfdb48404d2b99bec6fcd4c0c2c7ae9cc7d901ae08fc94c423"]
capabilities = ["calls", "data", "definitions", "imports", "references", "scopes", "tests", "types"]
license = "MIT"
source = "https://github.com/gyxoBka/omega-code-search-assets"

[resource_budget]
parse_millis = 200
query_millis = 200
max_matches = 15000
max_emitted_ir = 30000
max_injection_depth = 4
max_decoder_expansion = 2048
max_string_bytes = 65536

# Zig spells a test with the keyword `test`, so a test declaration is not a
# naming convention to be guessed at: it is the only form, and the host may
# treat the file's tests as completely enumerated. The declaration is the
# canonical identity of the block, so the host drops the generic definition at
# the same span and a test is one entity, in the Test family.
[test_capability]
schema_version = 1

[test_capability.declaration_forms."zig.test_declaration"]
coverage_family = "zig.declaration"

# Partial, not complete: `test { ... }` without a name declares no test here,
# and the unnamed form is idiomatic Zig.
[test_capability.coverage_families."zig.declaration"]
semantics = "partial_only"
held_out_eligible = false
