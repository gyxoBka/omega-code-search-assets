schema_version = 1
distribution_class = "production"
kind = "language"
name = "omega-cmake"
version = "2.0.0"
pack_runtime_version = "2"
parser_id = "tree-sitter-cmake"
compatible_grammar_identities = ["tree-sitter-cmake@c7b2a71e7f8ecb167fad4c97227c838439280175#nodes:516ce5e9fece97827bcf01d84f28e6a943aa18efcc0331e2522530206de04a91"]
capabilities = ["calls", "definitions", "imports", "references", "scopes", "tests"]
license = "MIT"
source = "https://github.com/gyxoBka/omega-code-search-assets"

[resource_budget]
parse_millis = 200
query_millis = 200
max_matches = 15000
max_emitted_ir = 30000
max_injection_depth = 4
max_decoder_expansion = 2048
max_string_bytes = 65536

# CMake registers a test with `add_test`, and that is the only form the
# language itself has. A test framework's discovery command enumerates its
# cases when cmake runs, so the list of tests in a project read from the
# source alone is partial and must not be reported as complete.
[test_capability]
schema_version = 1

[test_capability.declaration_forms."cmake.add_test"]
coverage_family = "cmake.add_test"

[test_capability.coverage_families."cmake.add_test"]
semantics = "partial_only"
held_out_eligible = false
