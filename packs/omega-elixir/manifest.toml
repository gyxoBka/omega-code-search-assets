schema_version = 1
distribution_class = "production"
kind = "language"
name = "omega-elixir"
version = "2.0.0"
pack_runtime_version = "2"
parser_id = "tree-sitter-elixir"
compatible_grammar_identities = ["tree-sitter-elixir@7937d3b4d65fa574163cfa59394515d3c1cf16f4#nodes:8a936726a29bbab3ed8e0a71ae9cd98253a4b87aa00276c078f4e5032b4df30d"]
capabilities = ["bindings", "calls", "definitions", "imports", "references", "scopes", "tests", "types"]
license = "MIT"
source = "https://github.com/gyxoBka/omega-code-search-assets"

[resource_budget]
parse_millis = 200
query_millis = 200
max_matches = 15000
max_emitted_ir = 30000
max_injection_depth = 4
max_decoder_expansion = 2048
max_string_bytes = 65536

# `test "..." do` is the canonical identity of the block it declares: the host
# drops the generic declaration at the same span so a test is one entity, in
# the Test family the test projection reads. `MyApp.AccountsTest` naming the
# module it covers is read off the name, so it is a convention candidate.
[test_capability]
schema_version = 1

[test_capability.declaration_forms."elixir.test_block"]
coverage_family = "elixir.ex_unit"

[test_capability.conventions."elixir.module_name_convention"]
coverage_family = "elixir.ex_unit"

[test_capability.coverage_families."elixir.ex_unit"]
semantics = "partial_only"
held_out_eligible = false
