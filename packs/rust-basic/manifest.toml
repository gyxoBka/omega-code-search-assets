schema_version = 1
distribution_class = "production"
kind = "language"
name = "omega-rust-basic"
version = "2.3.0"
pack_runtime_version = "2"
parser_id = "tree-sitter-rust"
capabilities = ["definitions", "scopes", "bindings", "imports", "calls", "references", "types", "value_origins", "modules", "implements", "tests", "config_consumers", "data"]
license = "MIT"
source = "omega-builtin"

[test_capability]
schema_version = 1

[test_capability.declaration_forms.rust_builtin_test_attribute]
coverage_family = "rust_builtin_test_attribute"

[test_capability.target_intents.rust_builtin_test_direct_call]
coverage_family = "rust_builtin_test_direct_call"

[test_capability.coverage_families.rust_builtin_test_attribute]
semantics = "complete_eligible"
held_out_eligible = true

[test_capability.coverage_families.rust_builtin_test_direct_call]
semantics = "complete_eligible"
held_out_eligible = true
[resource_budget]
parse_millis = 200
query_millis = 200
max_matches = 10000
max_emitted_ir = 20000
max_injection_depth = 4
max_decoder_expansion = 2048
max_string_bytes = 65536
