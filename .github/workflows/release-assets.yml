name: Release Omega Asset Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Asset domain to release
        required: true
        type: choice
        options:
          - packs
          - harness
      catalog_version:
        description: Catalog version, for example packs-v1 or harness-v1
        required: true
        type: string
      release_tag:
        description: Existing or new GitHub Release tag
        required: true
        type: string
  push:
    tags:
      - "packs-v*"
      - "harness-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      CATALOG_VERSION: ${{ github.event.inputs.catalog_version || github.ref_name }}
      REQUESTED_DOMAIN: ${{ github.event.inputs.domain }}
      OMEGA_ASSET_CATALOG_KEY_ID: ${{ secrets.OMEGA_ASSET_CATALOG_KEY_ID }}
      OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM: ${{ secrets.OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve asset domain
        shell: bash
        run: |
          if [[ -n "${REQUESTED_DOMAIN}" ]]; then
            domain="${REQUESTED_DOMAIN}"
          elif [[ "${RELEASE_TAG}" == packs-v* ]]; then
            domain="packs"
          elif [[ "${RELEASE_TAG}" == harness-v* ]]; then
            domain="harness"
          else
            echo "Cannot derive asset domain from release tag: ${RELEASE_TAG}" >&2
            exit 2
          fi
          echo "ASSET_DOMAIN=${domain}" >> "${GITHUB_ENV}"

      - name: Build signed catalog
        run: |
          node tools/build-catalog.mjs \
            --domain "${ASSET_DOMAIN}" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --catalog-version "${CATALOG_VERSION}" \
            --out dist/catalog.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-${{ env.ASSET_DOMAIN }}-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Omega ${ASSET_DOMAIN} catalog ${CATALOG_VERSION}"
          gh release upload "${RELEASE_TAG}" dist/* --clobber
