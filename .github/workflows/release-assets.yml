name: Release Omega Assets

on:
  workflow_dispatch:
    inputs:
      catalog_version:
        description: Catalog version, for example assets-v1
        required: true
        type: string
      release_tag:
        description: Existing or new GitHub Release tag
        required: true
        type: string
  push:
    tags:
      - "assets-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      CATALOG_VERSION: ${{ github.event.inputs.catalog_version || github.ref_name }}
      OMEGA_ASSET_CATALOG_KEY_ID: ${{ secrets.OMEGA_ASSET_CATALOG_KEY_ID }}
      OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM: ${{ secrets.OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build signed catalog
        run: |
          node tools/build-catalog.mjs \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --catalog-version "${CATALOG_VERSION}" \
            --out dist/catalog.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-assets-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Omega asset catalog ${CATALOG_VERSION}"
          gh release upload "${RELEASE_TAG}" dist/* --clobber
