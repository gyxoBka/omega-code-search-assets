name: Build Omega Asset Sources

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "grammars/**"
      - "packs/**"
      - "frameworks/**"
      - "harness/**"
      - "tools/build-source.mjs"
      - "package.json"
      - ".github/workflows/publish-ghcr.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build source archives
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: omega-code-search-assets-${{ github.sha }}
          path: dist/**
          if-no-files-found: error