name: Publish Omega GHCR Assets

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packs/**"
      - "harness/**"
      - "tools/**"
      - ".github/workflows/publish-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GHCR_OWNER: gyxobka
      GHCR_ROOT: omega-code-search-assets
      OMEGA_ASSET_CATALOG_KEY_ID: ${{ secrets.OMEGA_ASSET_CATALOG_KEY_ID }}
      OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM: ${{ secrets.OMEGA_ASSET_CATALOG_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oras-project/setup-oras@v1

      - name: Install package tooling
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build package archives
        run: node tools/build-packages.mjs --out dist/packages --update-catalog-source

      - name: Login to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push OCI artifacts
        run: node tools/push-ghcr-artifacts.mjs --packages dist/packages --out dist/oci-digests.json

      - name: Build signed catalogs
        run: |
          node tools/build-catalog.mjs \
            --domain packs \
            --registry-digests dist/oci-digests.json \
            --catalog-version "packs-${GITHUB_SHA::12}" \
            --out dist/catalogs/packs.json
          node tools/build-catalog.mjs \
            --domain harness \
            --registry-digests dist/oci-digests.json \
            --catalog-version "harness-${GITHUB_SHA::12}" \
            --out dist/catalogs/harness.json

      - name: Push registry catalogs
        run: |
          oras push "ghcr.io/${GHCR_OWNER}/${GHCR_ROOT}/catalog/packs:${GITHUB_SHA}" \
            dist/catalogs/packs.json:application/vnd.omega.catalog.v1+json \
            --artifact-type application/vnd.omega.catalog.v1
          oras push "ghcr.io/${GHCR_OWNER}/${GHCR_ROOT}/catalog/harness:${GITHUB_SHA}" \
            dist/catalogs/harness.json:application/vnd.omega.catalog.v1+json \
            --artifact-type application/vnd.omega.catalog.v1
          oras tag "ghcr.io/${GHCR_OWNER}/${GHCR_ROOT}/catalog/packs:${GITHUB_SHA}" current
          oras tag "ghcr.io/${GHCR_OWNER}/${GHCR_ROOT}/catalog/harness:${GITHUB_SHA}" current

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-ghcr-catalogs-${{ github.sha }}
          path: |
            dist/catalogs/*.json
            dist/oci-digests.json
          if-no-files-found: error
