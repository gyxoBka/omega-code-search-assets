schema_version = 1
distribution_class = "production"
kind = "framework"
name = "omega-framework-openapi-specification-v3"
version = "1.0.0"
pack_runtime_version = "2"
framework_selectors = ["framework:openapi-specification-v3"]
license = "MIT"
source = "Omega clean production normalization"

[resource_budget]
parse_millis = 250
query_millis = 250
max_matches = 10000
max_emitted_ir = 20000
max_injection_depth = 4
max_decoder_expansion = 2048
max_string_bytes = 65536
