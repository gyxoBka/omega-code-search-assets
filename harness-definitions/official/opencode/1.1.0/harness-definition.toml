schema_version = 1
id = "opencode"
display_name = "OpenCode"
version = "1.1.0"
stability = "stable_auto"
platforms = ["linux", "macos", "windows"]

[min_omega]
harness_runtime = 1

[capabilities]
mcp = true
instructions = true
skills = true
agents = true
hooks = true
native_mcp = true
current_scope = true

[[constraints]]
capability = "hooks"
platform = "windows"
state = "withheld"
reason = "no verified deterministic executor"

[detection]
install_when = { any_of = [
  { env_path_exists = "OPENCODE_CONFIG" },
  { command_exists = "opencode" },
  { dir_exists = "${HOME}/.config/opencode" },
  { env_path_exists = "OPENCODE_CONFIG_DIR" }
] }
cleanup_when = { any_of = [
  { file_exists = "${HOME}/.config/opencode/opencode.jsonc" },
  { file_exists = "${HOME}/.config/opencode/opencode.json" }
] }

[path_variables]
environment = ["OPENCODE_CONFIG", "OPENCODE_CONFIG_DIR"]

[[targets]]
id = "main_config"
format = "jsonc"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "env_override_then_prefer_existing"
env = "OPENCODE_CONFIG"
paths = [
  "${HOME}/.config/opencode/opencode.jsonc",
  "${HOME}/.config/opencode/opencode.json"
]
default = "${HOME}/.config/opencode/opencode.json"

[[targets]]
id = "agents_md"
format = "markdown"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "env_override"
env = "OPENCODE_CONFIG_DIR"
relative = "AGENTS.md"
fallback = "${HOME}/.config/opencode/AGENTS.md"

[mcp]
enabled = true
transport = "stdio"
server_key = "omega"
command = "@omega-mcp"
args = []
cwd_strategy = "inherit_process_cwd"
serialization = "mcp_local_json"
target = "main_config"
[mcp.environment]
OMEGA_LOG_LEVEL = "error"

[[mutations]]
id = "install_mcp"
target = "main_config"
kind = "owned_map_entry"
selector = ["mcp", "omega"]
value_from = "@mcp.serialized"
conflict_policy = "preserve_foreign"
[mutations.ownership]
identity = "omega-opencode-mcp-v1"
comparison = "semantic_json"
accepted_previous = ["omega-opencode-mcp-v0"]

[[instructions]]
id = "global_guide"
target = "agents_md"
content_profile = "omega-agent-guide-v1"
kind = "managed_text_block"
marker = "omega-agent-guide"

[[skills]]
id = "omega_skill"
target_path = "${HOME}/.config/opencode/skills/omega/SKILL.md"
content_profile = "omega-skill-v2"
ownership = "exact_owned_document"

[[agent_profiles]]
id = "omega-scout"
mode = "direct_mcp"
dialect = "opencode"
tool_policy = "omega-read-scout-v1"

[[hooks]]
event = "pre_tool"
matcher = ["grep", "glob"]
action = "omega-discovery-hint-v1"
fail_open = true
platforms = ["linux", "macos"]
renderer = "opencode_generated_plugin"

[[verification]]
level = "structural"
check = "owned_mutations_present"

[[verification]]
level = "process"
check = "omega_mcp_initialize"
expected_tools = 10

[[verification]]
level = "harness"
check = "manual_acceptance_required"

[[legacy_cleanup]]
target = "main_config"
selector = ["mcpServers", "omega"]
ownership_identity = "old-omega-v1"
