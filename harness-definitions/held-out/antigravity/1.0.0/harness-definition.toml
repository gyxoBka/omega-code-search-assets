schema_version = 1
id = "antigravity"
display_name = "Antigravity"
version = "1.0.0"
stability = "stable_auto"
platforms = ["linux", "macos", "windows"]
[min_omega]
harness_runtime = 1
[capabilities]
mcp = true
native_mcp = true
current_scope = true
[detection]
install_when = { any_of = [ { dir_exists = "${HOME}/.gemini/antigravity-cli" }, { command_exists = "antigravity" } ] }
cleanup_when = { file_exists = "${HOME}/.gemini/config/mcp_config.json" }
[[targets]]
id = "main_config"
format = "json"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "home_relative"
path = "${HOME}/.gemini/config/mcp_config.json"
[mcp]
enabled = true
transport = "stdio"
server_key = "omega"
command = "@omega-mcp"
args = []
cwd_strategy = "inherit_process_cwd"
serialization = "mcp_servers_json"
target = "main_config"
[[mutations]]
id = "install_mcp"
target = "main_config"
kind = "owned_map_entry"
selector = ["mcpServers", "omega"]
value_from = "@mcp.serialized"
conflict_policy = "preserve_foreign"
[mutations.ownership]
identity = "omega-antigravity-mcp-v1"
comparison = "semantic_json"
accepted_previous = []
[[verification]]
level = "structural"
check = "owned_mutations_present"
[[verification]]
level = "process"
check = "omega_mcp_initialize"
expected_tools = 10
[[verification]]
level = "harness"
check = "manual_acceptance_required"
