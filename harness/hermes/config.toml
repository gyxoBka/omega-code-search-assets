schema_version = 1
id = "hermes"
display_name = "Hermes"
version = "1.1.0"
stability = "stable_auto"
platforms = ["linux", "macos", "windows"]

[min_omega]
harness_runtime = 1

[capabilities]
mcp = true
skills = true
native_mcp = true
current_scope = true

[path_variables]
environment = ["HERMES_HOME"]

[detection]
install_when = { any_of = [ { env_path_exists = "HERMES_HOME" }, { dir_exists = "${HOME}/.hermes" }, { command_exists = "hermes" } ] }
cleanup_when = { file_exists = "${HOME}/.hermes/config.yaml" }

[[targets]]
id = "config"
format = "yaml"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "env_override"
env = "HERMES_HOME"
relative = "config.yaml"
fallback = "${HOME}/.hermes/config.yaml"

[mcp]
enabled = true
transport = "stdio"
server_key = "omega"
command = "@omega-mcp"
args = []
cwd_strategy = "inherit_process_cwd"
serialization = "yaml_mcp_servers_map"
target = "config"

[[mutations]]
id = "install_mcp"
target = "config"
kind = "owned_map_entry"
selector = ["mcp_servers", "omega"]
value_from = "@mcp.serialized"
conflict_policy = "preserve_foreign"
[mutations.ownership]
identity = "omega-hermes-mcp-v1"
comparison = "semantic_yaml"
accepted_previous = ["omega-hermes-mcp-v0"]

[[skills]]
id = "omega_skill"
target_path = "${HOME}/.hermes/skills/omega/SKILL.md"
content_profile = "omega-skill-v2"
ownership = "exact_owned_document"

[[verification]]
level = "structural"
check = "owned_mutations_present"

[[verification]]
level = "process"
check = "omega_mcp_initialize"
expected_tools = 10

[[verification]]
level = "harness"
check = "manual_acceptance_required"
