schema_version = 1
id = "claude"
display_name = "Claude Code"
version = "1.0.0"
stability = "stable_auto"
platforms = ["linux", "macos", "windows"]

[min_omega]
harness_runtime = 1

[capabilities]
mcp = true
instructions = true
native_mcp = true
current_scope = true

[path_variables]
environment = ["CLAUDE_CONFIG_DIR"]

[detection]
install_when = { any_of = [ { env_path_exists = "CLAUDE_CONFIG_DIR" }, { dir_exists = "${HOME}/.claude" }, { command_exists = "claude" } ] }
cleanup_when = { any_of = [ { file_exists = "${HOME}/.claude.json" }, { file_exists = "${HOME}/.claude/CLAUDE.md" } ] }

[[targets]]
id = "mcp"
format = "jsonc"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "env_override"
env = "CLAUDE_CONFIG_DIR"
relative = ".claude.json"
fallback = "${HOME}/.claude.json"

[[targets]]
id = "instructions"
format = "markdown"
scope = "user"
create_policy = "if_harness_detected"
[targets.resolver]
kind = "home_relative"
path = "${HOME}/.claude/CLAUDE.md"

[mcp]
enabled = true
transport = "stdio"
server_key = "omega"
command = "@omega-mcp"
args = []
cwd_strategy = "inherit_process_cwd"
serialization = "mcp_servers_json"
target = "mcp"

[[mutations]]
id = "install_mcp"
target = "mcp"
kind = "owned_map_entry"
selector = ["mcpServers", "omega"]
value_from = "@mcp.serialized"
conflict_policy = "preserve_foreign"
[mutations.ownership]
identity = "omega-claude-mcp-v1"
comparison = "semantic_json"
accepted_previous = ["omega-claude-mcp-v0"]

[[instructions]]
id = "global_guide"
target = "instructions"
content_profile = "omega-agent-guide-v1"
kind = "managed_text_block"
marker = "omega-agent-guide"

[[verification]]
level = "structural"
check = "owned_mutations_present"

[[verification]]
level = "process"
check = "omega_mcp_initialize"
expected_tools = 10

[[verification]]
level = "harness"
check = "manual_acceptance_required"
